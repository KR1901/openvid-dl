[package]
name = "openvid-core"
version = "0.6.0"
edition = "2021"
description = "Native download engine for openvid-dl (Android + desktop CLI)."
license = "GPL-3.0-or-later"

[lib]
name = "openvid_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "openvid-dl"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = []
android = ["dep:jni"]
cli = ["dep:clap", "dep:indicatif"]

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
# ureq is a pure-blocking HTTP client with no async runtime.
#
# We deliberately do NOT use reqwest here: reqwest 0.13's `rustls` feature
# hard-wires `rustls-platform-verifier`, which on Android needs a JVM Context
# (via ndk-context) that we never initialise. The TLS handshake then panics on
# reqwest's background runtime thread, surfacing as
# "event loop thread panicked". ureq's default features use bundled
# webpki roots instead, which work everywhere with no platform hooks.
ureq = "3.5.0"
# Brave's ad/tracker filtering engine, used to block requests in the WebView.
# Default features are disabled because they include `single-thread`, which
# makes `Engine` neither `Send` nor `Sync` — we store it in a global.
adblock = { version = "0.13.3", default-features = false, features = [
    "embedded-domain-resolver",
    "full-regex-handling",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
jni = { version = "0.22.4", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
indicatif = { version = "0.18.6", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
