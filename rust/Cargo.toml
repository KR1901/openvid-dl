[package]
name = "openvid-core"
version = "0.1.0"
edition = "2021"
description = "Native download engine for openvid-dl (Android + desktop CLI)."
license = "GPL-3.0-or-later"

[lib]
name = "openvid_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "openvid-dl"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = []
android = ["dep:jni"]
cli = ["dep:clap", "dep:indicatif"]

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
# reqwest 0.13 renamed the `rustls-tls` feature to `rustls` and made rustls the
# default backend; we still pin default-features = false and opt in explicitly.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
jni = { version = "0.22.4", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
indicatif = { version = "0.18.6", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
