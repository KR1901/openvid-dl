[package]
name = "openvid-dl"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Universal video downloader — any site, any quality, with audio."
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["video", "download", "downloader", "cli", "media"]
categories = ["command-line-utilities", "multimedia"]
repository = "https://github.com/KR1901/openvid-dl"
homepage = "https://github.com/KR1901/openvid-dl"

[[bin]]
name = "openvid-dl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "process"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
