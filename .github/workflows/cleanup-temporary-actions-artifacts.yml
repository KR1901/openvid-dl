name: One-time temporary Actions artifact cleanup

on:
  push:
    branches:
      - maintenance/cleanup-temporary-actions-artifacts-2026-11-13
    paths:
      - .github/workflows/cleanup-temporary-actions-artifacts.yml
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary OpenVid Actions APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const listAll = () => github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const isTemporaryApkArtifact = (item) => item.name === "openvid-dl-release-apk";
            const before = (await listAll()).filter((item) => !item.expired);
            const targets = before.filter(isTemporaryApkArtifact);
            const bytes = targets.reduce((sum, item) => sum + (item.size_in_bytes || 0), 0);
            core.info(`Found ${targets.length} temporary OpenVid Actions APK artifacts (${bytes} bytes).`);
            for (const artifact of targets) {
              core.info(`Deleting Actions artifact ${artifact.id}: ${artifact.name} (${artifact.size_in_bytes} bytes).`);
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              } catch (error) {
                const status = error.status || error.response?.status;
                if (status === 404 || status === 410) {
                  core.warning(`Artifact ${artifact.id} was already absent or expired.`);
                  continue;
                }
                throw error;
              }
            }
            const remaining = (await listAll()).filter((item) => !item.expired && isTemporaryApkArtifact(item));
            core.info(`Verification: ${remaining.length} temporary OpenVid Actions APK artifacts remain.`);
            if (remaining.length > 0) {
              throw new Error(`Cleanup incomplete: ${remaining.length} temporary artifact(s) remain.`);
            }
            core.notice(`Temporary OpenVid Actions APK artifacts cleaned. Approximate current bytes removed: ${bytes}. GitHub Release assets were not touched.`);
