name: Build APK

# Builds the Android app in the cloud so you don't need Android Studio.
#
#   * runs on every push to main, on tags like v0.7.0, and manually
#   * attaches the APK to a GitHub Release when a tag is pushed
#
# Only the release APK is built: it is signed (with your key when the secrets
# below are set, otherwise the debug key) and installable, and the debug build
# would add ~90 MB of bundled Python for yt-dlp for no benefit.
#
# Release signing (optional): add these repository secrets and the release
# APK will be signed with your key instead of falling back to the debug key.
#   KEYSTORE_BASE64     base64 of your .jks file
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform + NDK
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" > /dev/null || true
          "$SDKMANAGER" "ndk;30.0.16248370" > /dev/null 2>&1 || true
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/30.0.16248370"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using NDK: $NDK_DIR"
          {
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "ANDROID_NDK_ROOT=$NDK_DIR"
          } >> "$GITHUB_ENV"

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.toml') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare release signing
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: openvid-dl-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Stage release assets
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/openvid-dl-${GITHUB_REF_NAME}-arm64.apk"
          ls -l dist

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
